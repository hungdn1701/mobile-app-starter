name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build and Start Backend
        run: docker compose up -d
        
      - name: Wait for API to be ready
        run: sleep 5
        
      - name: Health Check API
        run: curl -f http://localhost:3000/users || exit 1
